<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 2</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      color: #f3f4f6;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      color: #f9fafb;
      text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .link-box {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      border: 2px solid #374151;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
    }

    a:hover {
      color: #fff;
      background: rgba(96, 165, 250, 0.1);
      text-decoration: underline;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: #374151;
      color: #f3f4f6;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #60a5fa;
      color: #0f0f1e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assignment 2</h1>

    <div class="link-box">
      <p>Open local server:</p>
      <a href="http://192.168.0.103:8000" target="_blank">http://192.168.0.103:8000</a>
    </div>

    <a href="../index.html" class="back-link">← Back to assignments</a>
  </div>
</body>
</html>
